# Configuración del CapSense Lab.
# Debe coincidir con las constantes del firmware (capsense_lab_v2_x.ino).

[medicion]
v_entrada = 4.92      # V: voltaje real del pin 5V (medido con multímetro)
r_pin = 25.0          # ohm: resistencia interna aproximada del pin de carga
k_cal = 1.0           # C_final = C_medida * k_cal (1.0 = sin corrección)
adc_n1 = 250          # primer nivel del ajuste de curva
adc_n2 = 700          # segundo nivel del ajuste de curva
adc_max = 1023
r_descarga = 560.0    # ohm: resistencia de descarga entre D3 y el nodo del capacitor

# Resistencias de carga, de menor a mayor (medidas con multímetro).
[[rangos]]
etiqueta = "10k"
r_ohm = 9790.0

[[rangos]]
etiqueta = "1M"
r_ohm = 996000.0

# Pines del Arduino en el montaje (docs/referencia/montaje.html). Deben coincidir con el firmware.
[pines]
carga = ["D2", "A5"]  # uno por rango: 10 kΩ y 1 MΩ
descarga = "D3"
lectura = "A0"
led_verde = "D4"
led_amarillo = "D5"
led_rojo = "D6"
boton_atras = "A1"
boton_start = "A2"
boton_siguiente = "A3"
lcd_rs = "D12"
lcd_e = "D11"
lcd_datos = ["D10", "D9", "D8", "D7"]   # DB4 a DB7

[serial]
puerto = ""           # vacío = autodetectar (COMx en Windows, /dev/ttyACM* o /dev/ttyUSB* en Linux, /dev/cu.* en macOS)
baud = 115200         # firmware v2.2. La v2.1 usa 9600.

[ui]
host = "127.0.0.1"
puerto_http = 8050
usuario = "Samuel"    # para el saludo de la cabecera
tema = "ambar"        # "ambar" (negro y naranja) o "neon" (azul, turquesa y violeta)

[demo]
c_uf = 100.0          # capacitor simulado
meseta_pct = 97.0     # meseta en % de 1023 (menos = más fuga)
ruido_lsb = 0.7       # desviación del ruido del ADC, en cuentas
velocidad = 1.0       # 1 = tiempo real; 5 = cinco veces más rápido
firmware = "2.3"     # firmware que imita el simulador: "2.3" o "2.2"

[logs]
carpeta = "logs"
