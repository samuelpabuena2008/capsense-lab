[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsense-lab"
dynamic = ["version"]
description = "Dashboard del CapSense Lab: medidor de capacitancia RC con Arduino Uno (1 µF a 1000 µF)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samuel Pabuena" }, { name = "Joel" }]
license = { text = "MIT" }
keywords = ["arduino", "capacitancia", "rc", "dash", "plotly", "fisica"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "dash>=2.9",
    "plotly>=5.18",
    "pyserial>=3.5",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
capsense = "capsense.cli:main"

[project.gui-scripts]
capsense-app = "capsense.cli:main_app"

[project.urls]
Repositorio = "https://github.com/samuelpabuena2008/capsense-lab"

[tool.setuptools.dynamic]
version = { attr = "capsense.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capsense = ["ui/assets/*.css", "ui/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:dash"
markers = ["lento: barridos largos con el simulador"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["capsense"]
ignore_missing_imports = true
warn_unused_ignores = true
